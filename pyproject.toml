[project]
name = "clip-gen"
version = "0.1.0"
description = "Prepare long videos for short-form editing with shot detection and representative frames."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=5,<6",
    "scenedetect>=0.7,<0.8",
]

[project.scripts]
clip-gen = "clip_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
