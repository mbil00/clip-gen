<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-gen</title>
<style>
  :root {
    --bg: #16130f;
    --panel: #1f1b15;
    --panel-2: #262019;
    --line: #3a3128;
    --text: #ece4d8;
    --muted: #a2937f;
    --accent: #e0a05c;
    --accent-dim: #7a5327;
    --error: #e07a5c;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px 80px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 940px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .lede { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=file], input[type=number] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    padding: 9px 11px;
    font: inherit;
  }
  input[type=number] { font-family: var(--mono); }
  input:focus-visible { outline: 2px solid var(--accent-dim); outline-offset: 1px; border-color: var(--accent-dim); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; opacity: .8; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; }
  button {
    background: var(--accent);
    color: #201709;
    border: 0;
    border-radius: 7px;
    padding: 10px 20px;
    font: 600 14px/1 inherit;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .done .dot, .failed .dot { animation: none; }
  .failed .dot { background: var(--error); }
  .failed .stage { color: var(--error); }
  .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  .shot { border-top: 1px solid var(--line); padding: 16px 0; }
  .shot.picked { background: rgba(224, 160, 92, .05); }
  .shot:first-of-type { border-top: 0; padding-top: 0; }
  .shot-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .shot-head input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 4px;
  }
  .toolbar .spacer { flex: 1; }
  .link-button {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px;
    cursor: pointer; padding: 0; text-decoration: underline;
  }
  .description {
    margin-top: 12px; padding: 12px 14px; border-radius: 7px;
    background: var(--panel-2); border: 1px solid var(--line); font-size: 14px;
  }
  .description p { margin: 0; white-space: pre-wrap; }
  .description .meta { margin-top: 8px; font-size: 11px; }
  .description.pending p, .description.running p { color: var(--muted); }
  .description.error p { color: var(--error); }
  .shot-id { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .frames { display: flex; gap: 10px; flex-wrap: wrap; }
  .frame { width: 168px; }
  .frame img {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
    border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2);
  }
  .frame span { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 5px; }
  video { width: 168px; border-radius: 6px; border: 1px solid var(--line); display: block; }
  a { color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
    padding: 14px; overflow: auto; max-height: 460px; font-family: var(--mono); font-size: 12px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>clip<span>-</span>gen</h1>
  <p class="lede">Upload a video, detect its shots, and capture representative frames from each one.</p>

  <form id="form" class="card">
    <label for="video">Video file</label>
    <input id="video" name="video" type="file" accept="video/*" required>

    <div class="grid">
      <div>
        <label for="adaptive_threshold">Adaptive threshold</label>
        <input id="adaptive_threshold" name="adaptive_threshold" type="number" value="3.0" step="0.1" min="0.1" required>
        <p class="hint">Lower finds more cuts.</p>
      </div>
      <div>
        <label for="minimum_shot_length">Min shot length (s)</label>
        <input id="minimum_shot_length" name="minimum_shot_length" type="number" value="0.5" step="0.1" min="0" required>
        <p class="hint">Shortest gap between cuts.</p>
      </div>
      <div>
        <label for="samples_per_shot">Frames per shot</label>
        <input id="samples_per_shot" name="samples_per_shot" type="number" value="3" step="1" min="1" required>
        <p class="hint">Evenly spaced in the shot.</p>
      </div>
    </div>

    <div class="row">
      <label class="check"><input id="render_clips" name="render_clips" type="checkbox" value="true"> Also render clip MP4s (slow, re-encodes)</label>
      <button id="submit" type="submit">Run</button>
    </div>
  </form>

  <section id="status" class="card hidden">
    <div class="status"><span class="dot"></span><span class="stage">Uploading</span></div>
    <p id="error" class="meta hidden"></p>
  </section>

  <section id="summary" class="card hidden">
    <div class="row">
      <div><strong id="shot-count"></strong> <span class="meta" id="summary-meta"></span></div>
      <a id="manifest-link" href="#" download>Download manifest</a>
    </div>
    <details style="margin-top:14px"><summary>Raw manifest JSON</summary><pre id="raw"></pre></details>
  </section>

  <section id="shots" class="card hidden">
    <div class="toolbar">
      <button id="describe" type="button" disabled>Describe selected</button>
      <button id="select-all" class="link-button" type="button">Select all</button>
      <button id="select-none" class="link-button" type="button">Clear</button>
      <span class="spacer"></span>
      <span id="model-status" class="meta"></span>
    </div>
    <div id="shot-list"></div>
  </section>
</main>

<script>
const form = document.getElementById("form");
const submit = document.getElementById("submit");
const statusCard = document.getElementById("status");
const stageText = statusCard.querySelector(".stage");
const errorText = document.getElementById("error");
const summary = document.getElementById("summary");
const shotsEl = document.getElementById("shots");
const shotList = document.getElementById("shot-list");
const describeButton = document.getElementById("describe");
const modelStatus = document.getElementById("model-status");
let current = null;

const timecode = (seconds) => {
  const minutes = Math.floor(seconds / 60);
  const rest = (seconds - minutes * 60).toFixed(2).padStart(5, "0");
  return `${minutes}:${rest}`;
};

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  submit.disabled = true;
  summary.classList.add("hidden");
  shotsEl.classList.add("hidden");
  errorText.classList.add("hidden");
  statusCard.className = "card";
  statusCard.classList.remove("hidden");
  stageText.textContent = "Uploading";

  try {
    const response = await fetch("/api/jobs", { method: "POST", body: new FormData(form) });
    if (!response.ok) throw new Error(`Upload failed (${response.status})`);
    poll((await response.json()).id);
  } catch (error) {
    fail(error.message);
  }
});

async function poll(jobId) {
  try {
    const job = await (await fetch(`/api/jobs/${jobId}`)).json();
    stageText.textContent = job.stage;
    if (job.status === "running") return setTimeout(() => poll(jobId), 800);
    if (job.status === "error") return fail(job.error);
    statusCard.classList.add("done");
    submit.disabled = false;
    render(jobId, job);
  } catch (error) {
    fail(error.message);
  }
}

function fail(message) {
  statusCard.className = "card failed";
  stageText.textContent = "Failed";
  errorText.textContent = message;
  errorText.classList.remove("hidden");
  submit.disabled = false;
}

function render(jobId, job) {
  const manifest = job.manifest;
  const fileUrl = (path) => `/jobs/${jobId}/files/${path}`;
  const total = manifest.shots.reduce((sum, shot) => sum + (shot.end - shot.start), 0);

  document.getElementById("shot-count").textContent = `${manifest.shots.length} shots`;
  document.getElementById("summary-meta").textContent =
    `· ${timecode(total)} total · threshold ${job.settings.adaptive_threshold} · min ${job.settings.minimum_shot_length}s · ${job.settings.samples_per_shot} frames/shot`;
  document.getElementById("manifest-link").href = fileUrl("shot-manifest.json");
  document.getElementById("raw").textContent = JSON.stringify(manifest, null, 2);
  summary.classList.remove("hidden");

  current = { jobId, job };
  shotList.innerHTML = manifest.shots.map((shot) => `
    <div class="shot" id="row-${shot.id}">
      <div class="shot-head">
        <input type="checkbox" value="${shot.id}" aria-label="Select ${shot.id}">
        <span class="shot-id">${shot.id}</span>
        <span class="meta">${timecode(shot.start)} → ${timecode(shot.end)}</span>
        <span class="meta">${(shot.end - shot.start).toFixed(2)}s</span>
      </div>
      <div class="frames">
        ${shot.samples.map((sample) => `
          <a class="frame" href="${fileUrl(sample.image)}" target="_blank" rel="noreferrer">
            <img src="${fileUrl(sample.image)}" alt="${shot.id} at ${sample.timestamp}s" loading="lazy">
            <span>${timecode(sample.timestamp)}</span>
          </a>`).join("")}
        ${job.settings.render_clips ? `<video src="${fileUrl(`clips/${shot.id}.mp4`)}" controls preload="none"></video>` : ""}
      </div>
      <div class="description hidden"></div>
    </div>`).join("");
  shotsEl.classList.remove("hidden");
  renderDescriptions(job.descriptions || {});
  checkModel();
}

const selected = () => [...shotList.querySelectorAll("input:checked")].map((box) => box.value);

shotList.addEventListener("change", (event) => {
  event.target.closest(".shot").classList.toggle("picked", event.target.checked);
  syncButton();
});

document.getElementById("select-all").addEventListener("click", () => setAll(true));
document.getElementById("select-none").addEventListener("click", () => setAll(false));

function setAll(checked) {
  shotList.querySelectorAll("input[type=checkbox]").forEach((box) => {
    box.checked = checked;
    box.closest(".shot").classList.toggle("picked", checked);
  });
  syncButton();
}

function syncButton() {
  const count = selected().length;
  describeButton.disabled = count === 0 || describeButton.dataset.busy === "true";
  describeButton.textContent = count ? `Describe ${count} scene${count > 1 ? "s" : ""}` : "Describe selected";
}

async function checkModel() {
  try {
    const model = await (await fetch("/api/model")).json();
    modelStatus.textContent = model.reachable
      ? `model: ${model.model.split("/").pop()}`
      : `model unreachable at ${model.url}`;
  } catch {
    modelStatus.textContent = "model status unknown";
  }
}

describeButton.addEventListener("click", async () => {
  const shotIds = selected();
  if (!shotIds.length || !current) return;
  describeButton.dataset.busy = "true";
  syncButton();
  try {
    const response = await fetch(`/api/jobs/${current.jobId}/describe`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ shot_ids: shotIds }),
    });
    if (!response.ok) throw new Error((await response.json()).detail || `Request failed (${response.status})`);
    renderDescriptions((await response.json()).descriptions);
    pollDescriptions();
  } catch (error) {
    describeButton.dataset.busy = "false";
    syncButton();
    alert(error.message);
  }
});

async function pollDescriptions() {
  const job = await (await fetch(`/api/jobs/${current.jobId}`)).json();
  const descriptions = job.descriptions || {};
  renderDescriptions(descriptions);
  const busy = Object.values(descriptions).some((d) => d.status === "pending" || d.status === "running");
  if (busy) return setTimeout(pollDescriptions, 1500);
  describeButton.dataset.busy = "false";
  syncButton();
}

function renderDescriptions(descriptions) {
  Object.values(descriptions).forEach((entry) => {
    const row = document.getElementById(`row-${entry.shot_id}`);
    if (!row) return;
    const box = row.querySelector(".description");
    box.className = `description ${entry.status}`;
    const body = {
      pending: "Queued for the model…",
      running: "Describing…",
      error: entry.error,
    }[entry.status] ?? entry.text;
    box.innerHTML = `<p></p>${entry.status === "done" && entry.model ? `<div class="meta"></div>` : ""}`;
    box.querySelector("p").textContent = body;
    if (entry.status === "done" && entry.model) {
      box.querySelector(".meta").textContent = entry.model.split("/").pop();
    }
  });
}
</script>
</body>
</html>
